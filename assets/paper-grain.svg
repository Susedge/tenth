<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2400" viewBox="0 0 1600 2400" preserveAspectRatio="none">
  <title>Organic paper grain texture</title>
  <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.72 0.48" numOctaves="4" seed="27" stitchTiles="noStitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.7" intercept="0.18"/>
      <feFuncG type="linear" slope="0.62" intercept="0.22"/>
      <feFuncB type="linear" slope="0.52" intercept="0.28"/>
      <feFuncA type="linear" slope="0.72"/>
    </feComponentTransfer>
  </filter>
  <rect width="1600" height="2400" fill="#8f7459" filter="url(#paperNoise)"/>
</svg>
